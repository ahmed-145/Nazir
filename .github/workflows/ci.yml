name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install mcp gitpython python-dotenv tenacity watchdog textual rich aiosqlite

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Set environment
        run: |
          echo "NAZIR_PROJECT_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
          echo "GOOGLE_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV

      - name: Run test suite
        run: python3 test_all_phases.py
        env:
          NAZIR_PROJECT_ROOT: ${{ github.workspace }}
